name = "adic-modules"
version = "0.1.0"
lintDriver = "batteries/runLinter"
defaultTargets = ["AdicModules", "AdicModulesTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "groupTheory"
git = "https://github.com/FormalFrontier/group-theory.git"
rev = "b5eb0fb8f71c80d4604c2ea90be67312c185701a"

[[require]]
name = "multivariate-polynomials"
git = "https://github.com/FormalFrontier/multivariate-polynomials.git"
rev = "5d58abb977f3281238ee5b4f37303a275b1b2426"

[[require]]
name = "coherent-modules"
git = "https://github.com/FormalFrontier/coherent-modules.git"
rev = "5cc03db3146c93e6ac1ac0647ee930fd16f3dd25"

[[require]]
name = "graded-rings"
git = "https://github.com/FormalFrontier/graded-rings.git"
rev = "4e0ced7542375a428d0d87336e9209b031364ef6"

[[lean_lib]]
name = "AdicModules"
globs = ["AdicModules", "AdicModules.+"]

[[lean_lib]]
name = "AdicModulesTest"
globs = ["AdicModulesTest", "AdicModulesTest.+"]

[lean_lib.leanOptions]
weak.linter.privateModule = false
