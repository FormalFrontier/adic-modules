name = "adic-modules"
version = "0.1.0"
defaultTargets = ["AdicModules", "AdicModulesTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[lean_lib]]
name = "AdicModules"

[[lean_lib]]
name = "AdicModulesTest"
globs = ["AdicModulesTest.+"]
