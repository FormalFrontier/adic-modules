# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "adic-modules"
  description: >-
    Lean theory of ideal-power torsion and adic module and ring completions,
    with quotient, tensor, finiteness and flatness interfaces. Also covers
    Henselian pairs and polynomial lifting, valuation-ring completions and
    localization, submodule closure and p-adic density, comaximal ideal powers
    and finite Chinese remainders.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Adic modules and completions of valuation rings"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Reusable mathematical constructions on Mathlib modules, ideals,
      inverse and direct limits, Henselian pairs, valuations, uniform completions
      and localization, together
      with cyclic additive groups and canonical integer singleton spans in unital
      rings. No mathematical novelty or source-author endorsement is claimed.
  - title: "Foundations of Rigid Geometry I"
    authors:
      - "Kazuhiro Fujiwara"
      - "Fumiharu Kato"
    id: "https://arxiv.org/abs/1308.4734v5"
    type: "book"
    relationship: "background"
    note: >-
      Motivating mathematics, including bounded torsion, separated principal-adic
      valuation-ring completions and the closure-as-intersection-of-sums formula
      in the 2017 book, Proposition 7.1.6 and Exercise 0.7.1. The bundled closure
      theorem uses a given compatible topological additive group over a semiring
      with fixed-scalar continuity, not a topology construction from arbitrary
      semiring filtrations. Detailed passage correspondence
      and remaining gaps are recorded separately; no whole-source coverage or
      completion claim is made by this library or metadata.

  - title: "Local Fields and Their Extensions"
    authors:
      - "Ivan B. Fesenko"
      - "Sergei V. Vostokov"
    type: "book"
    relationship: "background"
    note: >-
      Second edition (2002), II, §1, Corollary 1, pp. 36–37, and Exercise 4, p. 38.
      The factor-lifting result uses arbitrary adically complete commutative
      rings. The irreducible-reduction criterion instead takes an explicit
      global monic factor-lifting property in quotient form; no equivalence
      with Mathlib's simple-root Henselian classes or whole-source coverage
      is asserted.

  - title: "The Stacks Project"
    authors:
      - "The Stacks Project Authors"
    id: "https://stacks.math.columbia.edu"
    type: "reference work"
    relationship: "background"
    note: >-
      Henselian-pair and finite-algebra criteria (Tags 09XI and 04GE),
      integral transport (09XK), nested ideals (0DYD), nil ideals (0ALI),
      and Nakayama's lemma (00DV). The etale-point condition in Tag 09XI
      asserts existence; the library derives uniqueness separately using
      rigidity of etale sections. No complete formalization of the source
      is claimed.
  - title: "Commutative Ring Theory"
    authors:
      - "Hideyuki Matsumura"
    type: "book"
    location: "Theorem 2.1 (Cayley-Hamilton)"
    relationship: "background"
    note: >-
      Cited by the idempotent-lifting development, which uses Mathlib's
      finite-module Cayley-Hamilton interface.
  - title: "Onto endomorphisms are isomorphisms"
    authors:
      - "M. Orzech"
    type: "article"
    location: "American Mathematical Monthly 78 (1971), 357-362"
    relationship: "background"
    note: >-
      The endomorphism unit-reflection argument uses the theorem through
      Mathlib's Orzech formalization, together with Nakayama's lemma.

related_formalizations:
  - id: "https://github.com/FormalFrontier/group-theory"
    relationship: "builds-on"
    note: >-
      The quotient-torsion equivalence supplies the completion-coordinate
      comparison; the subgroup-basis total-boundedness interface is used
      in the adic compactness criterion. The exact release is pinned in
      lake-manifest.json.
  - id: "https://github.com/FormalFrontier/multivariate-polynomials"
    relationship: "builds-on"
    note: >-
      Strong finite-system Hensel lifting uses
      MvPolynomial.eval₂_sub_eval₂_sub_sum_pderiv_mem_sq from the released
      MultivariatePolynomials.Taylor interface. The resolved package graph
      also includes algebraic-direct-limits as a transitive package dependency,
      not a directly imported proof source here. Exact public releases are
      pinned in lake-manifest.json.
  - id: "https://github.com/FormalFrontier/coherent-modules"
    relationship: "builds-on"
    note: >-
      The raw-completion flatness criterion over a Noetherian completed
      coefficient ring uses the released CoherentModules.RingTheory.Flat.Equiv
      interface for semilinear flatness transport, retaining the canonical
      quotient actions. Coherent Modules is also reached through Multivariate
      Polynomials; an explicit root pin selects the shared public release
      recorded in lake-manifest.json.
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Mathematical infrastructure at revision
      83abb3e776bdefcbc447a1e44d0debe4010039e5 with Lean v4.34.0-rc2 and
      the complete pinned Lake dependency graph. Reuses Mathlib's module,
      ideal, completion, valuation and topology APIs. The comaximal-powers
      argument follows Neil Strickland's geometric-sum idea using Kenny Lau's
      left-ideal interfaces. Result-specific formalization approaches and
      contributor credit are detailed in docs/CREDITS.md.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        Formal Frontier AI agents using Lean, Lake, Git and Hive for original
        development, independent agent review, assembly and maintenance.
  notes: >-
    Original project expression and earlier source-repository adaptations are
    credited in docs/CREDITS.md. Unverified model identities and costs are omitted.

status:
  scope: >-
    Uniform ideal-power torsion and height-one primary-component exactness for
    torsion-source pairs over Dedekind domains; raw inverse-limit completions
    and scalar restriction along commutative algebras with compatible actions.
    Abstract uniform-completion comparisons require finitely generated ideals.
    A right-surjective exact pair remains middle exact after completion under
    induced/intrinsic range cofinality. The tensor comparison is surjective for a finite first
    original quotient and injective for a projective completed scalar extension.
    For finitely presented original modules, bijectivity follows from finite-free
    cofinality.
    A completed coefficient ring is Noetherian exactly when an original power
    quotient at any chosen precision n >= 2 is Noetherian; equivalently, the
    first quotient is Noetherian and the cotangent module is finite.
    The raw-module flatness criterion assumes a Noetherian completed
    coefficient ring. Under flatness of the raw module completion, its finite
    presentation is detected by any positive original power quotient.
    Henselian-pair criteria and coprime monic factor lifting over adically
    complete commutative rings; irreducible reduction at a maximal ideal uses
    a global monic factor-lifting property. Directed limits preserve Henselian
    pairs for nonempty directed systems with compatible ideals.
    Separated principal-adic valuation-ring comparisons require a nonzero
    generator; local and localization results retain their maximal-ideal,
    radical-disjointness and nonzero-prime hypotheses.
    Submodule closure uses a supplied compatible additive-group topology and
    continuous fixed-scalar actions. Dense-subsemiring span closure uses
    separately continuous addition and coefficient continuity at the generators.
    Left-ideal density uses a supplied ideal-power basis in a topological
    additive group, not an arbitrary filtration topology construction.
    Comaximal powers work for arbitrary semiring left ideals; Chinese remainders
    for finite ideal families in rings require pairwise comaximality and full
    two-sidedness. Detailed statements and applications are in docs/Guide.md,
    docs/Results.md and the module documentation. Book correspondence is partial:
    general nonseparated reduction, height/rational-rank additivity, isolated
    subgroups and value-group exact sequences are outside the stated scope.

