# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "adic-modules"
  description: >-
    Bounded ideal-power torsion, primary-component exactness, abstract adic
    completions, restriction of scalars for native adic completions, valuation-ring
    principal-adic completions, completed valuation integers, localization,
    residue fields and composite valuation subrings in Lean.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Adic modules and completions of valuation rings"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Reusable mathematical constructions on native mathlib modules, ideals,
      inverse limits, valuations, uniform completions and localization.
      No mathematical novelty or source-author endorsement is claimed.
  - title: "Foundations of Rigid Geometry I"
    authors:
      - "Kazuhiro Fujiwara"
      - "Fumiharu Kato"
    id: "https://arxiv.org/abs/1308.4734v5"
    type: "book"
    relationship: "background"
    note: >-
      Motivating mathematics, including bounded torsion and separated
      principal-adic valuation-ring completions. Detailed passage correspondence
      and remaining gaps are recorded separately; no whole-source coverage or
      completion claim is made by this library or metadata.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Native mathematical infrastructure at revision
      e37d88a26f3791ed5a93daa1f949af1021b8d103 with Lean v4.34.0-rc2 and
      the complete pinned Lake dependency graph.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        Formal Frontier AI agents using Lean, Lake, Git and Hive for original
        development, independent agent review, assembly and maintenance.
  notes: >-
    Original project expression and earlier source-repository adaptations are
    credited in docs/CREDITS.md. Historical development review does not approve
    later modifications. Unverified model identities and costs are omitted.

status:
  scope: >-
    Uniform ideal-power torsion, height-one Dedekind primary-component exactness
    for torsion-source pairs, ordinary integer-prime subgroup restrictions and
    valuation-free abstract completions for finitely generated ideals; native
    adic completion under restriction of scalars along arbitrary commutative
    algebras, with compatible module actions and ideal extension, without finite
    generation, flatness or separatedness; separated
    nonzero principal-adic valuation-ring
    completions of arbitrary valuation rank, with independent ring and field
    universes. Local, residue, spectrum and localization results keep their
    actual maximal-ideal, radical-disjointness and nonzero-prime hypotheses.
    General nonseparated reduction, height/rational-rank additivity, isolated
    subgroups, value-group exact sequences and source completion are not claimed.

review:
  status: "other: revision-specific independent AI-agent review"
  notes: >-
    Earlier bounded and primary-component contributions and module-readiness work
    received development review. The scalar-restriction proof and client were
    originally developed in the incubator; their destination transfer received
    its own independent review and configured build and private-inclusive
    standard-axiom checks before acceptance into development main on 2026-09-30.
    The donor's review and checks alone did not verify the destination graph.
    Documentation was also integrated into development main on 2026-09-30.
    Independent AI-agent review, proof-checking results, rights assessment and
    maintainer acceptance are recorded for exact revisions in the maintained
    project records. This metadata is not itself an approval of an arbitrary
    checkout or later modification. Development acceptance, official release,
    mirrored publication and source coverage are separate decisions; historical
    review does not certify later changes or whole-source coverage.

acknowledgements: >-
  Lean and mathlib authors for the proof assistant and mathematical infrastructure;
  Anchor for the attributed earlier project development and assembly, the
  original primary-component research contributor and its current port author,
  the original incubator scalar-restriction proof/client contributor and the
  distinct destination transfer author as distinguished in docs/CREDITS.md,
  and independent Formal Frontier agent
  reviewers of earlier work. Collective credit does not identify a legal
  copyright holder or clear incorporated third-party material.
