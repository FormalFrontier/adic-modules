# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "adic-modules"
  description: >-
    Bounded ideal-power torsion, primary-component exactness, abstract adic
    completions, restriction of scalars for native adic completions, integer
    singleton spans in unital rings, submodule closure from neighborhood bases,
    p-adic ideal-power bases and proper dense integer spans with top neighborhood
    suprema, valuation-ring principal-adic completions, completed valuation
    integers, localization, residue fields and composite valuation subrings in
    Lean. Also includes comaximal powers of arbitrary semiring left ideals with
    a written subtraction-free proof, a left-ideal density criterion with a
    written direct additive proof for supplied ring powers topologies, and a
    dense-subsemiring span-closure comparison with generatorwise coefficient
    continuity. Finite Chinese remainders for fully two-sided ideal families in
    possibly noncommutative rings give canonical ring and common-base linear
    equivalences, inverse representative cosets, independent powers and
    precision-reduction compatibility. Four left-ideal and five real, discrete,
    p-adic and degenerate-boundary model source files retain original independent
    calculations, alongside additional private integer-density, natural-matrix
    comaximal-powers and real rational-axis applications.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Adic modules and completions of valuation rings"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Reusable mathematical constructions on native mathlib modules, ideals,
      inverse limits, valuations, uniform completions and localization, together
      with cyclic additive groups and canonical integer singleton spans in unital
      rings. No mathematical novelty or source-author endorsement is claimed.
  - title: "Foundations of Rigid Geometry I"
    authors:
      - "Kazuhiro Fujiwara"
      - "Fumiharu Kato"
    id: "https://arxiv.org/abs/1308.4734v5"
    type: "book"
    relationship: "background"
    note: >-
      Motivating mathematics, including bounded torsion, separated principal-adic
      valuation-ring completions and the closure-as-intersection-of-sums formula
      in the 2017 book, Proposition 7.1.6 and Exercise 0.7.1. The bundled closure
      theorem uses a given compatible topological additive group over a semiring
      with fixed-scalar continuity, not a topology construction from arbitrary
      semiring filtrations. Detailed passage correspondence
      and remaining gaps are recorded separately; no whole-source coverage or
      completion claim is made by this library or metadata.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Native mathematical infrastructure at revision
      83abb3e776bdefcbc447a1e44d0debe4010039e5 with Lean v4.34.0-rc2 and
      the complete pinned Lake dependency graph. The submodule-closure formula
      reuses Filter.HasBasis.iInter_add_right_eq_closure, canonical submodule
      carriers and PLift basis reindexing for Sort-valued indices. The cyclic-ring
      integer-span results reuse cyclic additive endomorphisms and right
      multiplication evaluated at one, with the canonical integer action and
      singleton-span interfaces. The comaximal-powers theorem reuses Mathlib's
      semiring left-ideal membership and power APIs, authored by Kenny Lau,
      and follows Neil Strickland's geometric-sum proof idea through a recurrence
      without subtraction or a commutation premise. Mathlib's sup_pow_eq_top and
      sup_pow_eq_top' have additional two-sidedness assumptions on the unpowered
      and powered ideals, respectively; two private lemmas recover these
      conclusions from the public theorem. The left-ideal density proof uses
      nhds_of_zero to translate the supplied ideal-power basis and
      mem_closure_iff_nhds_basis to test closure, together with the comaximal-powers
      theorem, without restriction to integer scalars. P-adic bases reuse the
      geometric closed-ball basis and norm/ideal carrier identity; density transports integer casts
      through unit multiplication, and properness uses the existing p-adic inverse
      and faithful integer casts. Top suprema with restricted ideal neighborhoods
      consume the generic submodule-closure formula, the dense-closure
      characterization and complete-lattice APIs. The dense-subsemiring comparison
      uses canonical Subsemiring.module and Subsemiring.smul_def restriction,
      AddSubmonoid.topologicalClosure for additive closure under separately
      continuous addition, Continuous.range_subset_closure_image_dense at the
      selected generators and Submodule.span_induction with the strengthened
      assertion that every scalar multiple lies in that closure.
      Submodule.span_subset_span supplies the reverse inclusion. The original
      real and discrete-module calculations, independent of the comparison, reuse
      singleton-span eliminators, rational cast density, continuous-image closure,
      coordinate and product continuity, irrational sqrt two and the closed
      integer image in the real line. The real model also includes an additional
      private application of Submodule.closure_span_eq_of_dense_subsemiring to
      the rational axis.
      P-adic singleton models apply closure_image_closure, DenseRange.closure_range,
      span_singleton_eq_range and Int.cast_smul_eq_zsmul directly on the canonical
      self-module, with norm/ideal closedness and existing neighborhood bases.
      Empty, zero and subsingleton calculations use stock span and closure APIs;
      indiscrete rational self-module controls use stock indiscrete topology.
      The independent discrete rational module uses ULift.module' and its
      canonical algebraic transport, retaining the separate scalar topology.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        Formal Frontier AI agents using Lean, Lake, Git and Hive for original
        development, independent agent review, assembly and maintenance.
  notes: >-
    Original project expression and earlier source-repository adaptations are
    credited in docs/CREDITS.md. Unverified model identities and costs are omitted.

status:
  scope: >-
    Uniform ideal-power torsion, height-one Dedekind primary-component exactness
    for torsion-source pairs, ordinary integer-prime subgroup restrictions and
    valuation-free abstract completions for finitely generated ideals; native
    adic completion under restriction of scalars along arbitrary commutative
    algebras, with compatible module actions and ideal extension, without finite
    generation, flatness or separatedness; submodule closure as the infimum of
    sums with active submodule neighborhoods of zero over a semiring, with
    independent scalar, module and Sort-valued index universes, a compatible
    group topology and fixed-scalar continuity. This requires no scalar topology,
    Hausdorffness, countability or closedness, and does not construct a topology
    from arbitrary semiring filtrations. In a NonAssocRing with the canonical
    integer action, additive cyclicity or a top singleton integer span implies
    surjective integer casts; nonsurjective casts make every singleton integer
    span proper, without multiplication associativity, commutativity,
    characteristic-zero, nontriviality or topology assumptions. Also included
    are dense integer spans of units in any ring with dense integer casts and
    fixed-element multiplication continuity; prime p-adic ideal-power
    neighborhood bases for the usual norm topology, self- and integer-scalar
    linearity, dense integer spans of p-adic units and integer generators not
    divisible by p, properness for every integer generator, and the proper dense
    integer span of 3 in the 2-adic integers excluding 1, whose supremum with every
    restricted ideal generated by 2^n is top. The generic density theorem and
    eleven p-adic results give twelve results; clients add excluded elements
    using positive-degree ideal neighborhoods.
    Separated nonzero principal-adic valuation-ring
    completions of arbitrary valuation rank, with independent ring and field
    universes. Local, residue, spectrum and localization results keep their
    actual maximal-ideal, radical-disjointness and nonzero-prime hypotheses.
    Submodule.closure_span_eq_of_dense_subsemiring identifies the set closures
    of spans over a dense subsemiring and its ambient semiring acting on an
    additive commutative monoid, with independent scalar and module universes
    and topologies,
    separately continuous addition and coefficient-map continuity only at the
    selected members of an arbitrary generating set. The action is canonically
    restricted on the same module. It assumes no additive group, joint addition,
    global coefficient continuity, ContinuousSMul, T1, nonempty generators or
    finiteness. Empty and zero-generator spans have closure of the zero singleton,
    which need not be that singleton without T1. The proof uses additive-submonoid
    topological closure, generatorwise continuous dense images and span induction
    with the assertion that every scalar multiple lies in that closure.
    The original span and closure calculations in all five model source files
    Real, Discrete, PadicInt, Boundary and Indiscrete are independent of the
    generic proof. Real also includes an additional private application of
    Submodule.closure_span_eq_of_dense_subsemiring to the rational axis, identifying
    its proper closure and excluding the second coordinate unit.
    Real and Discrete retain the rational-axis, missing-density,
    missing-coefficient-continuity and mixed-axis calculations. PadicInt uses
    the canonical normed p-adic self-module and integer restriction: arbitrary
    singleton closures agree by direct stock reuse; units and one give whole
    closures, the nonzero nonunit p gives a proper closed norm sublevel ideal
    excluding one (including p = 2), and zero gives the closed zero singleton.
    Existing ideal-power neighborhoods, zero membership and shifted norm balls
    are included. Boundary supplies empty, zero and arbitrary-set subsingleton
    calculations, and a nontrivial indiscrete rational self-module where the zero
    singleton is nonclosed, its closure is universal and T1 fails. Indiscrete uses
    indiscrete rational scalars and independent discrete ULift rationals with the
    canonical action: the integer-cast range subsemiring is dense and proper,
    fixed-scalar maps are continuous, the integer and restricted-subsemiring
    singleton spans coincide and are closed proper with transported half
    excluded, but the rational span is whole and coefficient continuity fails.
    General nonseparated reduction, height/rational-rank additivity, isolated
    subgroups, value-group exact sequences and source completion are not claimed.
    The public root also re-exports Ideal.dense_iff_sup_eq_top_of_hasBasis:
    for every R : Type u with Ring R, TopologicalSpace R and
    IsTopologicalAddGroup R, and arbitrary left ideals I and J, a given basis
    (𝓝 (0 : R)).HasBasis (fun _n : ℕ ↦ True)
    (fun n ↦ ((I ^ n : Ideal R) : Set R)) yields
    Dense (J : Set R) iff J ⊔ I = ⊤. No two-sidedness, separation, closedness,
    multiplication continuity or continuous ring scalar action is required.
    Its written direct additive proof translates the powers basis to each ring
    element and tests closure by intersection with these neighborhoods. Density
    at 1 and degree one puts 1 in J ⊔ I; conversely, all-power comaximality
    decomposes r = j + i and gives j - r = -i in I ^ n. The topology is the same
    supplied topology, not one constructed from an arbitrary filtration. All
    ideal coefficients, carriers, sums and powers are those of the original
    ring. The proof needs no restriction to integer scalars or submodule
    closure formula.
    Separately, AdicModules.RingTheory.Ideal.Operations provides the public
    Ideal.sup_pow_eq_top_of_sup_eq_top with the full universe-polymorphic statement
    ∀ {R : Type u} [Semiring R] {J I : Ideal R} {n : ℕ}, J ⊔ I = ⊤ → J ⊔ I ^ n = ⊤.
    Its written proof uses a subtraction-free geometric-sum recurrence and only
    left multiplication closure. Both ideals are arbitrary left ideals, and
    powers are whole ideal powers in the original semiring, not spans of powers
    of chosen generators. The application API covers every natural exponent,
    including zero, without commutativity, additive inverses, ring, domain,
    cancellation, nontriviality or two-sidedness hypotheses. Two private
    specializations recover Mathlib's conclusions when the unpowered or powered
    ideal, respectively, is two-sided; they add no public entry points or
    hypotheses to the general theorem. The density proof applies this algebraic
    implication and uses the compatible additive-group topology directly.
    Four model files contain direct calculations and theorem applications: the original
    integers with (2)-adic topology and the proper dense ideal (3), all-power
    comaximality and residue representatives; nonzero proper non-two-sided
    column ideals in M₂(ℤ), an induced second-column powers topology with a
    nonclosed proper dense ideal, non-Hausdorffness and discontinuous right
    multiplication; canonical M₂(ℕ) semiring columns with membership iff
    contracts, idempotent positive powers and both all-power suprema,
    noncommuting elementary matrix units (not invertible units), failure of
    multiplication cancellation and an additive-inverse obstruction for the
    canonical addition. In that semiring E01 squared is zero but the square
    of its generated left ideal contains nonzero E11, so generator powers
    cannot replace ideal powers. Boundary proof terms cover zeroth versus first
    powers, discrete integer nondensity despite comaximality and failure of the
    (2)-power basis, the closed proper nondense (2) in the actual (2)-adic
    integers, top/indiscrete and bottom/discrete bases, density of every ideal
    but not the empty set in the indiscrete integers and failure of T1 there,
    density of the top ideal with only a semiring and topology, bottom density
    iff the defining ideal is top under the stated ring powers-basis hypothesis,
    and subsingleton semirings and the one-element ring with all ideal powers.
    Purely algebraic semiring models require no extra commutative, domain or
    ring structure. The direct calculations do not invoke the general density
    criterion. The integer file additionally applies that criterion to (3) in
    the (2)-adic topology, and the natural-matrix file applies the comaximal-powers
    theorem to its column ideals.
    For a possibly noncommutative ring R and a finite index type in an independent
    universe, a fully two-sided ideal family with pairwise supremum top gives
    the canonical quotient-by-intersection ring equivalence to the product of
    quotients. Each tuple has a unique preimage as a quotient class; its
    simultaneous ring representatives form an additive coset of the intersection.
    The ring equivalence and its inverse agree with Mathlib's commutative
    constructions. Independent natural powers, including zero, need comaximality
    only of the original family, still with full family two-sidedness. The
    common-base R-linear equivalence uses the same additive equivalence and
    canonical left quotient/Pi actions; its characteristic API identifies the
    underlying type and additive equivalences, canonical forward function, components,
    representatives, scalar preservation and the inverse quotient-class bridge.
    Forward and inverse equivalences commute with quotient factors for pointwise
    family inclusions, and with independent precision reduction, including zero.
    With full two-sidedness but no finiteness or comaximality, the canonical map
    agrees as a function with the product of linear quotient factors and
    preserves the common left R-action. Separately, given one solution, the
    congruence solution-coset lemma works for arbitrary ring left ideals and index
    types; the independent-power comaximality guard needs only a semiring and
    arbitrary left ideals. Neither is a finite CRT for arbitrary left ideals.
    The public root imports 22 mathematical leaf modules, including the
    comaximal-powers theorems, finite Chinese remainder equivalence, density
    criterion and dense-subsemiring span comparison; with the root these are 23
    main-library source modules. The 36 separate test/model/audit files include
    the finite-quotient clients, all four left-ideal and all five span-model
    sources, giving 59 tracked Lean source modules. These are source-file counts,
    not counts of mathematical models, compiled declarations or kernel axioms.
    These counts and written proof descriptions do not certify complete library
    proof integrity, including transitive standard-axiom dependencies of private,
    generated, model and imported declarations.

review:
  status: "incomplete"
  notes: >-
    Independent AI-agent review of bounded ideal-power torsion, primary-component
    exactness, module interfaces and the scalar-restriction proof and client is
    revision-specific. Review and proof-checking results do not certify arbitrary
    checkouts or later modifications. The public comaximal-powers theorem has
    a written subtraction-free proof, the density criterion has a written direct
    additive proof, and the dense-subsemiring span comparison uses additive
    closure, generatorwise continuous dense images and span induction. All four
    left-ideal and all five span-model files retain original independent
    calculations; Int, MatrixNat and Real also contain additional private
    applications. The complete 22-leaf and 36-test source rosters and model maps
    are in README.md and docs/Guide.md; docs/README.md distinguishes them from
    the historical API. Mathematical proof descriptions, source counts and
    historical reviews do not establish complete transitive standard-axiom
    assurance. Revision-specific checks must include private, generated, test
    and imported declarations, permitting only propext, Classical.choice and
    Quot.sound.
    No human peer review or whole-source coverage is claimed.

